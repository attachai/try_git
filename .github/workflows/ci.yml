name: CI

on:
  push:
    branches:
      - feature/family-reward-phase-0-1
  pull_request:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
